<nav class="view-switcher" aria-label="Chuyển giao diện">

      <a class="back-link" [routerLink]="target" aria-label="Quay lại trang trước">← Quay lại</a>
    }
  <span class="switcher-brand"><img src="brand/mykingdom-icon-white.png" alt="MyKingdom" width="32" height="32"><span>THE TOYS WE REMEMBER</span></span>

  <div class="view-links">
